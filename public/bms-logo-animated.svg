<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a3e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes gearSpin { to{transform:rotate(360deg)} }
      @keyframes windowBlink1 { 0%,100%{opacity:0.4} 50%{opacity:0.95} }
      @keyframes windowBlink2 { 0%,100%{opacity:0.9} 50%{opacity:0.3} }
      @keyframes windowBlink3 { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes shimmer { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes pulseGlow { 0%,100%{r:80;opacity:0.15} 50%{r:110;opacity:0.05} }
      .float{animation:float 4s ease-in-out infinite}
      .gear{animation:gearSpin 8s linear infinite;transform-origin:14px 14px}
      .w1{animation:windowBlink1 3s ease-in-out infinite}
      .w2{animation:windowBlink2 2.5s ease-in-out infinite}
      .w3{animation:windowBlink3 3.5s ease-in-out infinite}
      .w4{animation:windowBlink1 4s ease-in-out infinite}
      .w5{animation:windowBlink2 2.8s ease-in-out infinite}
      .w6{animation:windowBlink3 3.2s ease-in-out infinite}
      .shimmer{animation:shimmer 3s ease-in-out infinite}
      .pulse{animation:pulseGlow 2.5s ease-in-out infinite}
    </style>
  </defs>

  <!-- Pulsing glow behind shield -->
  <circle cx="150" cy="155" class="pulse" fill="#3b82f6" opacity="0.15" r="80"/>

  <!-- ===== SHIELD (floating) ===== -->
  <g class="float">
    <!-- Outer shield -->
    <path d="M150 10 L270 60 L270 170 C270 230 210 280 150 296 C90 280 30 230 30 170 L30 60 Z"
          fill="url(#shieldGrad)" opacity="0.9"/>
    <!-- Inner shield -->
    <path d="M150 24 L256 68 L256 166 C256 222 198 266 150 280 C102 266 44 222 44 166 L44 68 Z"
          fill="url(#shieldInner)"/>

    <!-- ===== BUILDING ICON ===== -->
    <g transform="translate(90, 75)">
      <!-- Main tower -->
      <rect x="36" y="20" width="48" height="136" rx="2" fill="url(#buildingGrad)" opacity="0.85"/>
      <!-- Tower top -->
      <rect x="52" y="8" width="16" height="16" rx="1" fill="#60a5fa" opacity="0.7"/>
      <line x1="60" y1="0" x2="60" y2="8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <!-- Left wing -->
      <rect x="8" y="68" width="32" height="88" rx="2" fill="url(#buildingGrad)" opacity="0.7"/>
      <!-- Right wing -->
      <rect x="80" y="56" width="32" height="100" rx="2" fill="url(#buildingGrad)" opacity="0.7"/>

      <!-- Animated windows — Main tower -->
      <rect x="44" y="32" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w1"/>
      <rect x="56" y="32" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w2"/>
      <rect x="68" y="32" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w3"/>
      <rect x="44" y="48" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w4"/>
      <rect x="56" y="48" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w1"/>
      <rect x="68" y="48" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w5"/>
      <rect x="44" y="64" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w3"/>
      <rect x="56" y="64" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w6"/>
      <rect x="68" y="64" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w2"/>
      <rect x="44" y="80" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w5"/>
      <rect x="56" y="80" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w3"/>
      <rect x="68" y="80" width="8" height="8" rx="1" fill="url(#windowGlow)" class="w1"/>

      <!-- Left windows -->
      <rect x="16" y="80" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w2"/>
      <rect x="26" y="80" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w4"/>
      <rect x="16" y="96" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w6"/>
      <rect x="26" y="96" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w1"/>
      <rect x="16" y="112" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w3"/>
      <rect x="26" y="112" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w5"/>

      <!-- Right windows -->
      <rect x="88" y="68" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w3"/>
      <rect x="98" y="68" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w1"/>
      <rect x="88" y="84" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w5"/>
      <rect x="98" y="84" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w2"/>
      <rect x="88" y="100" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w4"/>
      <rect x="98" y="100" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w6"/>
      <rect x="88" y="116" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w1"/>
      <rect x="98" y="116" width="6" height="6" rx="0.5" fill="url(#windowGlow)" class="w3"/>

      <!-- Entrance -->
      <rect x="52" y="128" width="16" height="28" rx="2" fill="#1e3a5f" opacity="0.8"/>
      <rect x="54" y="130" width="12" height="24" rx="1" fill="#f59e0b" class="shimmer"/>
      <!-- Ground -->
      <line x1="0" y1="156" x2="120" y2="156" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- ===== GEAR ICON ===== -->
    <g transform="translate(210, 200)">
      <g class="gear">
        <circle cx="14" cy="14" r="6" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
        <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
          <line x1="14" y1="0" x2="14" y2="5"/>
          <line x1="14" y1="23" x2="14" y2="28"/>
          <line x1="0" y1="14" x2="5" y2="14"/>
          <line x1="23" y1="14" x2="28" y2="14"/>
          <line x1="4" y1="4" x2="7.5" y2="7.5"/>
          <line x1="20.5" y1="20.5" x2="24" y2="24"/>
          <line x1="24" y1="4" x2="20.5" y2="7.5"/>
          <line x1="7.5" y1="20.5" x2="4" y2="24"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== BMS TEXT ===== -->
  <text x="150" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="10" letter-spacing="3" fill="url(#textGrad)" class="shimmer">
    BUILDING MANAGEMENT SYSTEM
  </text>
</svg>
